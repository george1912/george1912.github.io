<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fox Timer</title>
  <meta name="description" content="You've been invited to the first Fox Timer beta." />
  <link rel="icon" type="image/png" href="assets/icon128.png" />
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #bdbdbd;
      color: #111;
      font-family: "Chicago", "Monaco", "Courier New", monospace;
    }

    .window {
      width: min(560px, calc(100% - 28px));
      background: #fff;
      border: 2px solid #000;
      box-shadow: 4px 4px 0 #000;
    }

    .titlebar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      border-bottom: 2px solid #000;
      background:
        repeating-linear-gradient(
          0deg,
          #fff 0 1px,
          #000 1px 2px,
          #fff 2px 3px,
          #000 3px 4px
        );
    }

    .traffic {
      width: 12px;
      height: 12px;
      border: 1.5px solid #000;
      background: #fff;
      flex-shrink: 0;
    }

    .titlebar span {
      background: #fff;
      padding: 0 8px;
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    .screen {
      background: #000;
      color: #f2f2f2;
      padding: 28px 24px 24px;
      min-height: 320px;
    }

    .prompt {
      margin: 0 0 18px;
      font-size: 12px;
      opacity: 0.7;
      letter-spacing: 0.06em;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .invite {
      margin: 10px 0 0;
      font-size: 14px;
      letter-spacing: 0.04em;
    }

    .blurb {
      margin: 22px 0 0;
      font-size: 14px;
      line-height: 1.55;
      max-width: 34ch;
      color: #d8d8d8;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 28px;
    }

    .btn {
      display: inline-block;
      padding: 10px 14px;
      border: 1.5px solid #f2f2f2;
      color: #f2f2f2;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    .btn:hover {
      background: #f2f2f2;
      color: #000;
    }

    .btn-solid {
      background: #f2f2f2;
      color: #000;
    }

    .btn-solid:hover {
      background: #fff;
    }

    .foot {
      margin-top: 26px;
      font-size: 11px;
      opacity: 0.55;
      letter-spacing: 0.05em;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      margin-left: 4px;
      background: #f2f2f2;
      vertical-align: -2px;
      animation: blink 1.1s steps(1, end) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .back {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
    }

    .back a {
      color: #222;
      text-decoration: none;
      border-bottom: 1px solid #666;
    }
  </style>
</head>
<body>
  <div>
    <main class="window" aria-label="Fox Timer">
      <div class="titlebar">
        <div class="traffic" aria-hidden="true"></div>
        <span>Fox Timer</span>
      </div>
      <div class="screen">
        <p class="prompt">Last login: Beta Wave 001</p>
        <h1>Fox Timer</h1>
        <p class="invite">You’ve been invited to the first beta.<span class="cursor" aria-hidden="true"></span></p>
        <p class="blurb">
          A simple Chrome helper that keeps your ATI session awake while you work.
          Download the ZIP, then open the Install Guide.
        </p>
        <div class="actions">
          <a class="btn btn-solid" href="fox-timer-extension.zip" download>Download ZIP</a>
          <a class="btn" href="install.html">Easy Install Guide</a>
        </div>
        <p class="foot">v1.0.0 · Use Google Chrome</p>
      </div>
    </main>
    <p class="back"><a href="../">Back</a></p>
  </div>
</body>
</html>
