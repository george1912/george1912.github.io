<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Construction</title>
  <meta name="description" content="Thanks for finding this page. Unfortunately, under construction." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="favicon-32x32.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage" aria-label="Under construction">
    <div class="sky" aria-hidden="true">
      <div class="rain" id="rain"></div>
      <div class="ground"></div>
      <div class="puddle"></div>
      <div class="worker">
        <div class="cone"></div>
        <div class="sign">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="figure">
          <div class="hat"></div>
          <div class="head"></div>
          <div class="body"></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
        </div>
      </div>
    </div>

    <section class="copy">
      <p class="eyebrow">404 vibes · still standing</p>
      <h1>Thanks for finding this page.</h1>
      <p class="lede">
        Unfortunately, under construction.
        The hard hats are on. The coffee is cold. Come back later.
      </p>
      <p class="fine">Nothing to see here yet. Not even a portfolio. Especially not an email developer portfolio.</p>
    </section>
  </main>

  <script>
    const rain = document.getElementById('rain')
    const drops = 42
    for (let i = 0; i < drops; i += 1) {
      const drop = document.createElement('i')
      drop.style.left = `${Math.random() * 100}%`
      drop.style.animationDuration = `${0.7 + Math.random() * 0.9}s`
      drop.style.animationDelay = `${Math.random() * 2}s`
      drop.style.opacity = String(0.35 + Math.random() * 0.55)
      drop.style.height = `${10 + Math.random() * 14}px`
      rain.appendChild(drop)
    }
  </script>
</body>
</html>
